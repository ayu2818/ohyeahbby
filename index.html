<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3e0);
}

.page{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:absolute;
    top:0;
    left:0;
}

.hidden{
    display:none;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:20px;
    padding:20px;
    text-shadow:0 4px 10px rgba(0,0,0,0.2);
}

p{
    color:white;
    font-size:1.2rem;
    margin-bottom:20px;
    padding:0 20px;
}

.buttons{
    margin-top:30px;
    position:relative;
    width:100%;
    height:300px;
}

button{
    padding:15px 35px;
    font-size:1.2rem;
    border:none;
    border-radius:50px;
    cursor:pointer;
    position:absolute;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.yes{
    background:#ff2e63;
    color:white;
    left:35%;
    top:80px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.no{
    background:white;
    color:#ff2e63;
    left:55%;
    top:80px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.signature{
    position:absolute;
    bottom:20px;
    color:white;
    font-size:1rem;
}

.final{
    color:white;
    font-size:4rem;
    animation:pulse 1s infinite alternate;
    text-shadow:0 4px 10px rgba(0,0,0,0.2);
    padding:20px;
}

@keyframes pulse{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }
}

.heart{
    position:absolute;
    color:red;
    animation:float 4s linear forwards;
    pointer-events:none;
}

@keyframes float{

    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- PAGE 1 -->

<div class="page" id="page1">

    <h1>Hi Love ❤️<br>Do You Love Me?</h1>

    <p>You only have one correct answer 😌</p>

    <div class="buttons">

        <button class="yes" id="yes1">
            YES ❤️
        </button>

        <button class="no" id="no1">
            NO 🙈
        </button>

    </div>

    <div class="signature">
        from your BOBO ❤️
    </div>

</div>

<!-- PAGE 2 -->

<div class="page hidden" id="page2">

    <h1>Will You Marry Me? 💍</h1>

    <p>Please say yes 🥺❤️</p>

    <div class="buttons">

        <button class="yes" id="yes2">
            YES 💖
        </button>

        <button class="no" id="no2">
            NO 😭
        </button>

    </div>

    <div class="signature">
        forever yours, BOBO ❤️
    </div>

</div>

<!-- PAGE 3 -->

<div class="page hidden" id="page3">

    <h1>Can we do BDSM thrice a week?? ❤️</h1>

    <p>You better choose correctly 😌</p>

    <div class="buttons">

        <button class="yes" id="yes3">
            YES 😍
        </button>

        <button class="no" id="no3">
            NO 🙈
        </button>

    </div>

</div>

<!-- PAGE 4 -->

<div class="page hidden" id="page4">

    <div class="final">
        THERE'S NO WAY U DONT WANNA GET FUCKED HARD😭
    </div>

</div>

<!-- PAGE 5 -->

<div class="page hidden" id="page5">

    <div class="final">
        OHH YEAHHH FUCK YOU HARDER BABY
    </div>

</div>

<script>

// PAGE 1 -> PAGE 2

document.getElementById("yes1").onclick = function(){

    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");

}

// PAGE 2 -> PAGE 3

document.getElementById("yes2").onclick = function(){

    document.getElementById("page2").classList.add("hidden");
    document.getElementById("page3").classList.remove("hidden");

}

// PAGE 3 YES -> PAGE 5

document.getElementById("yes3").onclick = function(){

    document.getElementById("page3").classList.add("hidden");
    document.getElementById("page5").classList.remove("hidden");

    createHearts();

}

// PAGE 3 NO -> PAGE 4

document.getElementById("no3").onclick = function(){

    document.getElementById("page3").classList.add("hidden");
    document.getElementById("page4").classList.remove("hidden");

    createHearts();

}

// MOVE BUTTON FUNCTION

function moveButton(button){

    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 100);

    button.style.left = x + "px";
    button.style.top = y + "px";
}

// FIRST TWO NO BUTTONS MOVE

const no1 = document.getElementById("no1");
const no2 = document.getElementById("no2");

no1.addEventListener("mouseover", function(){
    moveButton(no1);
});

no2.addEventListener("mouseover", function(){
    moveButton(no2);
});

no1.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton(no1);
});

no2.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton(no2);
});

// HEARTS

function createHearts(){

    setInterval(function(){

        let heart = document.createElement("div");

        heart.classList.add("heart");

        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize = (Math.random() * 30 + 20) + "px";

        document.body.appendChild(heart);

        setTimeout(function(){

            heart.remove();

        },4000);

    },150);
}

</script>

</body>
</html>
